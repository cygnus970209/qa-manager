# QA Manager - 단일 호스트 운영용 구성.
# 사전 준비: 루트 .env (DB_HOST=db 로 설정 — 컨테이너 네트워크 호스트명).
#
# 실행:
#   docker compose up -d --build
# 종료:
#   docker compose down              # 컨테이너만 제거 (DB 데이터 유지)
#   docker compose down -v           # 볼륨까지 제거 (DB 데이터 삭제)

services:
  db:
    image: mariadb:11
    container_name: qa-manager-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    # DB 포트 외부 노출 — 회사 고정 IP만 호스트 방화벽/보안그룹에서 3306 허용할 것.
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qa-manager-redis
    restart: unless-stopped
    # 영속화 없이 휘발성 캐시로 사용 (블랙리스트는 토큰 TTL 동안만 유효하면 충분)
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: qa-manager-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Timezone
      TZ: Asia/Seoul
      # Spring 프로필 (운영 로깅/설정 활성화)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # DB
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis (토큰 블랙리스트)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      # Auth Cookie (운영 HTTPS 에서는 COOKIE_SECURE=true 필수)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      # AWS S3
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_PRESIGN_TTL_SECONDS: ${AWS_S3_PRESIGN_TTL_SECONDS:-300}
      # 첨부 파일 최대 크기 (MB) — frontend 의 NUXT_PUBLIC_UPLOAD_MAX_FILE_SIZE_MB 와 같은 값 주입
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-100}
      # CORS — 프론트 도메인 (compose 내부에서는 frontend:3000)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # MS Teams 알림 (Bot Framework 프로액티브 메세징)
      TEAMS_ENABLED: ${TEAMS_ENABLED:-false}
      # Graph 조회용 (email -> AAD Object ID)
      TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
      TEAMS_CLIENT_ID: ${TEAMS_CLIENT_ID:-}
      TEAMS_CLIENT_SECRET: ${TEAMS_CLIENT_SECRET:-}
      # Bot Connector 발송용 (Azure Bot App ID / secret)
      TEAMS_BOT_APP_ID: ${TEAMS_BOT_APP_ID:-}
      TEAMS_BOT_APP_PASSWORD: ${TEAMS_BOT_APP_PASSWORD:-}
      # 싱글테넌트 봇: 회사 tenant id 로 주입 (기본값 botframework.com 은 멀티테넌트용)
      TEAMS_BOT_TENANT_ID: ${TEAMS_BOT_TENANT_ID:-botframework.com}
      TEAMS_SERVICE_URL: ${TEAMS_SERVICE_URL:-https://smba.trafficmanager.net/teams/}
      TEAMS_EMAIL_DOMAIN: ${TEAMS_EMAIL_DOMAIN:-}
      TEAMS_CONNECT_TIMEOUT: ${TEAMS_CONNECT_TIMEOUT:-5}
      TEAMS_READ_TIMEOUT: ${TEAMS_READ_TIMEOUT:-10}
      # 로그인 보안: IP 기반 조건부 이메일 OTP (기본 비활성 — 켜기 전 신뢰 IP/SMTP 필수)
      SECURITY_IP_OTP_ENABLED: ${SECURITY_IP_OTP_ENABLED:-false}
      # 신뢰 IP/CIDR (콤마 구분). 비우면 전원 OTP 대상이 되므로 활성화 시 반드시 사무실 IP 주입.
      SECURITY_TRUSTED_CIDRS: ${SECURITY_TRUSTED_CIDRS:-}
      # 신뢰 프록시 hop 수 (nginx 1단=1). X-Forwarded-For 위조 방지 판정 기준.
      SECURITY_TRUSTED_PROXY_COUNT: ${SECURITY_TRUSTED_PROXY_COUNT:-1}
      SECURITY_OTP_MAIL_FROM: ${SECURITY_OTP_MAIL_FROM:-QA Manager <no-reply@intocns.com>}
      # SMTP (OTP 메일 발송)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8357:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: qa-manager-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      # Nuxt 런타임에서 API 호출 base URL
      # SSR (서버 사이드 fetch) 은 컨테이너 네트워크로, 클라이언트 fetch 는 호스트에서 접근 가능한 URL 필요
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      # 첨부 파일 최대 크기 (MB) — backend 의 UPLOAD_MAX_FILE_SIZE_MB 와 같은 .env 값 사용
      NUXT_PUBLIC_UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-100}
    ports:
      - "3247:3000"

volumes:
  db-data:

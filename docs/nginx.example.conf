# ─────────────────────────────────────────────────────────────
# QA Manager - Nginx 리버스 프록시 예시
#
# 사용:
#   1) example.com 자리에 실제 도메인 입력
#   2) ssl_certificate / ssl_certificate_key 경로 수정 (Let's Encrypt 등)
#   3) /etc/nginx/sites-available/ 에 복사 후 sites-enabled 에 심볼릭 링크
#   4) nginx -t && systemctl reload nginx
#
# 가정:
#   - 같은 호스트의 docker compose 가 backend(8357/8358), frontend(3247/3248) 를 listen
#   - 무중단 배포(./deploy.sh)는 파랑/초록 두 벌을 번갈아 띄우므로 upstream 에 두 포트를 모두 둔다.
#     초록은 반드시 `backup` — 파랑이 살아 있으면 모든 요청을 파랑으로, 파랑이 내려가면 초록으로 보낸다.
#     두 색이 겹치는 동안 요청을 번갈아(round-robin) 보내면 HTML 은 새 빌드에서 받고 그 안의
#     /_nuxt/*.js 청크는 옛 빌드로 가서 404 → "Failed to fetch dynamically imported module" 가 난다.
#     연결 자체가 안 되는(error) 경우만 다음 서버로 넘기므로 POST 가 중복 실행되지 않는다.
#   - 호스트에서 직접 실행하면 8080 / 3000 하나씩으로 바꾼다
# ─────────────────────────────────────────────────────────────

upstream qa_backend {
    server 127.0.0.1:8357 max_fails=1 fail_timeout=5s;          # 파랑 (기본)
    server 127.0.0.1:8358 max_fails=1 fail_timeout=5s backup;   # 초록 — 파랑이 내려갔을 때만
    keepalive 32;
}

upstream qa_frontend {
    server 127.0.0.1:3247 max_fails=1 fail_timeout=5s;          # 파랑 (기본)
    server 127.0.0.1:3248 max_fails=1 fail_timeout=5s backup;   # 초록 — 파랑이 내려갔을 때만
    keepalive 32;
}

# ─────────────── HTTP → HTTPS 리다이렉트 ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Let's Encrypt webroot 검증용 (필요 시)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────── HTTPS 본 서버 ───────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # 인증서
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 업로드 사이즈 (S3 직접 업로드라 백엔드 트래픽은 작지만 여유 있게)
    client_max_body_size 10m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # 공통 프록시 헤더
    proxy_http_version 1.1;
    # 꺼진 색으로 간 요청은 연결 실패(error)·타임아웃일 때만 다른 색으로 재시도 (기본값을 명시)
    proxy_next_upstream error timeout;
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ─────────────── 알림 SSE (buffering OFF 필수) ───────────────
    location = /api/notifications/stream {
        proxy_pass http://qa_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;   # SSE 연결 유지 (백엔드 emitter timeout 30분과 맞춤)
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
    }

    # ─────────────── 백엔드 API ───────────────
    location /api/ {
        proxy_pass http://qa_backend;
    }

    # Swagger / OpenAPI
    location /swagger-ui {
        proxy_pass http://qa_backend;
    }
    location /swagger-ui.html {
        proxy_pass http://qa_backend;
    }
    location /v3/api-docs {
        proxy_pass http://qa_backend;
    }

    # Actuator (헬스체크 등) — 외부 공개하지 않을 거면 이 블록 제거
    location /actuator/ {
        # 내부망만 허용 예시
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass http://qa_backend;
    }

    # ─────────────── 프론트엔드 (Nuxt SSR) ───────────────
    # _payload.json / _nuxt/* / 라우트 모두 같은 노드 서버로
    location / {
        proxy_pass http://qa_frontend;
    }

    # Nuxt 정적 자산 캐싱 (해시 포함 파일명이라 long-cache 안전)
    location /_nuxt/ {
        proxy_pass http://qa_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

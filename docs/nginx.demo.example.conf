# ─────────────────────────────────────────────────────────────
# QA Manager 데모 - Nginx 리버스 프록시 + Let's Encrypt 예시
#
# 구조: 인터넷 →(443/TLS) 이 nginx →(127.0.0.1:8070) 데모 컨테이너 → 정적 SPA
#
# 데모 컨테이너는 docker-compose.demo.yml 로 127.0.0.1:8070 에 떠 있다고 가정.
# (운영 docker-compose.yml 과 무관한 별도 정적 스택)
#
# 적용:
#   1) /etc/nginx/sites-available/qa-manager-demo 로 저장
#   2) ln -s ../sites-available/qa-manager-demo /etc/nginx/sites-enabled/
#   3) 인증서 발급 후 (아래 DEPLOY 주석 참고) nginx -t && systemctl reload nginx
#
# 인증서가 아직 없으면 이 파일(443 블록)을 바로 활성화하면 nginx 가 뜨지 않는다.
# 가장 쉬운 발급: 80 블록만 둔 채 `certbot --nginx -d qa-manager-demo.cygnus2.com`
# 실행하면 certbot 이 443 블록을 자동 생성해준다(이 파일은 그 최종 형태의 참고본).
# ─────────────────────────────────────────────────────────────

upstream qa_demo {
    server 127.0.0.1:8070;
    keepalive 32;
}

# ─────────────── HTTP → HTTPS 리다이렉트 (+ ACME 갱신 통로) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name qa-manager-demo.cygnus2.com;

    # Let's Encrypt webroot 검증/갱신용
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────── HTTPS 본 서버 ───────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qa-manager-demo.cygnus2.com;

    ssl_certificate     /etc/letsencrypt/live/qa-manager-demo.cygnus2.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa-manager-demo.cygnus2.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — HTTPS 고정. 데모를 나중에 HTTP 로 되돌릴 계획이면 max-age 를 짧게(예: 300) 두거나 제거.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 정적 SPA 라 단일 upstream 으로 전부 프록시.
    # (X-Frame-Options/nosniff/캐시 등 응답 헤더는 컨테이너 내부 nginx 가 이미 부여하므로 여기선 중복 부여하지 않는다)
    location / {
        proxy_pass http://qa_demo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 데모 전용 스택 — 백엔드/DB/Redis 없이 정적 SPA(localStorage mock)만 nginx 로 서빙한다.
# 운영(docker-compose.yml)과 완전히 분리된 단일 컨테이너이며 .env 도 필요 없다.
#
# 배포:
#   docker compose -f docker-compose.demo.yml up -d --build
# 업데이트:
#   git pull && docker compose -f docker-compose.demo.yml up -d --build
# 종료:
#   docker compose -f docker-compose.demo.yml down

services:
  demo:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    container_name: qa-manager-demo
    restart: unless-stopped
    ports:
      # 호스트의 127.0.0.1:8070 에만 바인딩 → 외부는 8070 으로 직접 접근 불가(TLS 우회 차단).
      # 실제 공개는 앞단 nginx 리버스 프록시(443)가 이 포트로 프록시한다.
      - "127.0.0.1:8070:80"

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: qa-manager

  # 루트의 .env 파일을 환경변수로 로드 (값이 없어도 무시).
  config:
    import: optional:file:../.env[.properties]

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qa_manager}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: qa-manager-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    # 컨테이너 TZ=Asia/Seoul 와 일관성. Jackson 3 에선 ISO 문자열이 기본이라 별도 옵션 불필요.
    time-zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ─────────────── App-specific ───────────────
app:
  jwt:
    # JWT_SECRET 미설정 시 부팅 실패 (기본값 두지 않음). 32바이트 이상 권장, 운영은 64바이트 이상.
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    # 운영(HTTPS)에서는 COOKIE_SECURE=true. 로컬 개발(HTTP)은 false 유지.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  s3:
    region: ${AWS_REGION:}
    bucket: ${AWS_S3_BUCKET:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presign-ttl-seconds: ${AWS_S3_PRESIGN_TTL_SECONDS:300}
  teams:
    # 비활성화 기본값: 환경변수 누락 시 모든 발송 no-op (테스트/로컬 안전).
    enabled: ${TEAMS_ENABLED:false}
    tenant-id: ${TEAMS_TENANT_ID:}
    client-id: ${TEAMS_CLIENT_ID:}
    client-secret: ${TEAMS_CLIENT_SECRET:}
    # 발송 봇으로 사용할 user 의 AAD Object ID. oneOnOne chat 의 한쪽 멤버가 된다.
    bot-user-oid: ${TEAMS_BOT_USER_OID:}
    # 회사 메일 도메인. username 이 이 도메인으로 끝나면 자동으로 발송 대상.
    # 빈 값이면 (도메인 무관) 모든 멤버를 발송 시도 — 단 email 또는 username 이 email 형식이어야 함.
    email-domain: ${TEAMS_EMAIL_DOMAIN:}
    # Graph API 호출 timeout (초).
    connect-timeout-seconds: ${TEAMS_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${TEAMS_READ_TIMEOUT:10}

logging:
  level:
    com.qamanager: DEBUG
    org.hibernate.SQL: DEBUG

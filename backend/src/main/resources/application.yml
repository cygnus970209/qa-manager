server:
  port: 8080
  forward-headers-strategy: framework
  # 무중단 배포(deploy.sh): 옛 컨테이너를 내릴 때 새 요청은 거절하고 처리 중인 요청은 마친 뒤 종료한다.
  # SSE 스트림은 SseEmitterRegistry(SmartLifecycle) 가 이 단계보다 먼저 닫아 대기 시간을 끌지 않는다.
  shutdown: graceful

spring:
  application:
    name: qa-manager

  # 루트의 .env 파일을 환경변수로 로드 (값이 없어도 무시).
  config:
    import: optional:file:../.env[.properties]

  threads:
    virtual:
      enabled: true

  lifecycle:
    # graceful shutdown 에서 처리 중인 요청을 기다리는 최대 시간 (docker stop_grace_period 40s 보다 짧게)
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qa_manager}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: qa-manager-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    # 컨테이너 TZ=Asia/Seoul 와 일관성. Jackson 3 에선 ISO 문자열이 기본이라 별도 옵션 불필요.
    time-zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  # 로그인 OTP 발송용 SMTP. 자격증명은 환경변수/시크릿으로만 주입.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    # /actuator/health 는 docker healthcheck·무중단 배포(deploy.sh)의 기준이다.
    # SMTP 가 잠시 안 되는 것 때문에 앱 전체를 DOWN 으로 보고 배포를 막지 않도록 메일 지표는 뺀다 (DB·Redis 는 포함).
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ─────────────── App-specific ───────────────
app:
  jwt:
    # JWT_SECRET 미설정 시 부팅 실패 (기본값 두지 않음). 32바이트 이상 권장, 운영은 64바이트 이상.
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    # IP 기반 조건부 이메일 OTP 로그인.
    ip-otp:
      # false 면 전 구간 현행 동작(즉시 토큰). 롤백 스위치.
      enabled: ${SECURITY_IP_OTP_ENABLED:false}
      # 이 대역에서의 로그인은 OTP 면제(CIDR, 콤마 구분). 비어있으면 "모든 IP가 OTP 대상".
      trusted-cidrs: ${SECURITY_TRUSTED_CIDRS:}
      # 클라이언트 IP 판정 시 신뢰하는 프록시 hop 수(nginx 1단=1). X-Forwarded-For 오른쪽에서 N번째를 채택.
      trusted-proxy-count: ${SECURITY_TRUSTED_PROXY_COUNT:1}
      # 발신 표시 주소.
      mail-from: ${SECURITY_OTP_MAIL_FROM:QA Manager <no-reply@intocns.com>}
      otp:
        length: 6
        ttl-seconds: 600
        max-attempts: 5
        resend-cooldown-seconds: 60
  cookie:
    # 운영(HTTPS)에서는 COOKIE_SECURE=true. 로컬 개발(HTTP)은 false 유지.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  s3:
    region: ${AWS_REGION:}
    bucket: ${AWS_S3_BUCKET:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presign-ttl-seconds: ${AWS_S3_PRESIGN_TTL_SECONDS:300}
  upload:
    # 첨부 파일 최대 크기 (MB). 프론트 사전 검증(NUXT_PUBLIC_UPLOAD_MAX_FILE_SIZE_MB)과 값을 맞출 것.
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:100}
  teams:
    # 비활성화 기본값: 환경변수 누락 시 모든 발송 no-op (테스트/로컬 안전).
    enabled: ${TEAMS_ENABLED:false}
    # ── Graph 조회용 자격증명 (email -> AAD Object ID) ──
    tenant-id: ${TEAMS_TENANT_ID:}
    client-id: ${TEAMS_CLIENT_ID:}
    client-secret: ${TEAMS_CLIENT_SECRET:}
    # ── Bot Connector 발송용 (Azure Bot 리소스의 Microsoft App ID / secret) ──
    # 메세지는 Bot Framework 프로액티브 발송으로 보낸다. 봇이 사용자 personal scope 에 설치돼 있어야 함.
    bot-app-id: ${TEAMS_BOT_APP_ID:}
    bot-app-password: ${TEAMS_BOT_APP_PASSWORD:}
    # Bot Connector 토큰 발급 tenant. 멀티테넌트 봇이면 botframework.com, 싱글테넌트면 회사 tenant id.
    bot-tenant-id: ${TEAMS_BOT_TENANT_ID:botframework.com}
    # 인바운드 activity 의 serviceUrl 이 캐시에 없을 때 쓰는 글로벌 기본값 (public cloud).
    service-url-default: ${TEAMS_SERVICE_URL:https://smba.trafficmanager.net/teams/}
    # 회사 메일 도메인. username 이 이 도메인으로 끝나면 자동으로 발송 대상.
    # 빈 값이면 (도메인 무관) 모든 멤버를 발송 시도 — 단 email 또는 username 이 email 형식이어야 함.
    email-domain: ${TEAMS_EMAIL_DOMAIN:}
    # Graph / Bot Connector 호출 timeout (초).
    connect-timeout-seconds: ${TEAMS_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${TEAMS_READ_TIMEOUT:10}
  github:
    # GitHub 이슈트래킹 연동. 앱 자격증명(app id/private key)은 여기 없다 —
    # 관리자 설정의 Manifest flow 로 런타임에 생성되어 DB(github_app 테이블)에 저장된다.
    # GHES(GitHub Enterprise Server) 사용 시에만 base url 을 바꾼다 (api 는 https://HOST/api/v3).
    web-base-url: ${GITHUB_WEB_BASE_URL:https://github.com}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    connect-timeout-seconds: ${GITHUB_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${GITHUB_READ_TIMEOUT:10}

logging:
  level:
    com.qamanager: DEBUG
    org.hibernate.SQL: DEBUG

# 운영 프로필 오버라이드.
# spring.profiles.active=prod 로 활성화.
# 민감 정보 로깅 방지를 위해 SQL/내부 DEBUG 로그를 차단.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false

logging:
  level:
    root: WARN
    com.qamanager: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security: INFO
    org.springframework.web: WARN
